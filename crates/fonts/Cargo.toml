[package]
name = "pdfcraft-fonts"
description = "Font metrics and text encoding helpers for generated appearances (standard fonts, WinAnsi)"
version.workspace = true
edition.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
pdfcraft-cos = { workspace = true }
# Glyph outlines of the bundled script font (typed signatures); already in the tree via egui.
skrifa = "0.44"
# Arabic shaping for text written into PDFs; already in the tree via egui, on the same read-fonts.
harfrust = "0.12"
unicode-bidi = "0.3"
# Static instances of a variable font (styles.rs): PDF fonts are fixed designs, so a variable
# font's named Regular/Bold/Italic are cut out before embedding. Apache-2.0; pure-Rust deflate
# (no C zlib) so mobile cross-builds need no C toolchain.
allsorts = { version = "0.17", default-features = false, features = ["flate2_rust"] }
